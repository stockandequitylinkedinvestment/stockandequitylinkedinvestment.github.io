<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Investment Platform</title>
<script src="https://cdn.tailwindcss.com"></script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>

<style>
body { background: #0b2a55; color: white; }
.hidden { display:none; }
</style>
</head>

<body class="p-6">

<!-- LOGIN -->
<div id="authBox">
  <h1 class="text-2xl mb-4">Login</h1>
  <input id="email" placeholder="Email" class="p-2 text-black w-full mb-2">
  <input id="password" type="password" placeholder="Password" class="p-2 text-black w-full mb-2">

  <button onclick="signup()" class="bg-white text-black px-4 py-2">Register</button>
  <button onclick="login()" class="bg-black border px-4 py-2">Login</button>
</div>

<!-- DASHBOARD -->
<div id="app" class="hidden">
  <h2>Investment Dashboard</h2>

  <button onclick="invest('Silver',1000)" class="bg-white text-black px-3 py-2 m-2">Silver</button>
  <button onclick="invest('Gold',10000)" class="bg-yellow-400 text-black px-3 py-2 m-2">Gold</button>
  <button onclick="invest('Diamond',50000)" class="bg-blue-400 text-black px-3 py-2 m-2">Diamond</button>

  <br><br>
  <button onclick="logout()" class="bg-red-500 px-3 py-2">Logout</button>
</div>

<script>
// ===== FIREBASE CONFIG (YOU MUST REPLACE THIS) =====
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

// INIT
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// AUTH
function signup(){
  auth.createUserWithEmailAndPassword(
    email.value,
    password.value
  ).then(() => alert("Registered"));
}

function login(){
  auth.signInWithEmailAndPassword(
    email.value,
    password.value
  ).then(() => {
    document.getElementById("authBox").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
  });
}

function logout(){
  auth.signOut();
  location.reload();
}

// INVESTMENT (REAL DATABASE SAVE)
function invest(tier, amount){
  const user = auth.currentUser;

  db.collection("investments").add({
    email: user.email,
    tier: tier,
    amount: amount,
    profit: amount * 3,
    time: new Date()
  });

  alert("Investment saved to backend!");
}

</script>

</body>
</html>

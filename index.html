<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock & Equity Investment Platform</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: #000;
  color: #fff;
}

.smooth { transition: 0.3s ease; }

.card:hover { transform: translateY(-6px); }

.glass {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
}
</style>
</head>

<body class="min-h-screen px-6 flex flex-col items-center justify-center">

<!-- ================= AUTH ================= -->
<div class="fixed top-4 right-4 glass border border-white/20 p-3 rounded-xl text-xs z-50">
  <div id="authState">Not logged in</div>
  <button onclick="openAuth()" class="mt-2 bg-white text-black px-3 py-1 rounded-lg">
    Login
  </button>
</div>

<!-- AUTH MODAL -->
<div id="authModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-6 z-50">
  <div class="bg-black border border-white/20 rounded-2xl p-6 w-full max-w-sm">

    <h2 class="text-xl font-bold mb-4">Account Login</h2>

    <input id="email" type="email" placeholder="Email"
      class="w-full p-3 mb-3 bg-white/5 border border-white/10 rounded-xl text-white">

    <button onclick="register()" class="w-full bg-white text-black py-2 rounded-xl mb-2">
      Register / Save
    </button>

    <button onclick="login()" class="w-full bg-gray-700 text-white py-2 rounded-xl">
      Login
    </button>

    <button onclick="closeAuth()" class="mt-4 text-gray-400 text-sm w-full">
      Close
    </button>

  </div>
</div>

<!-- ================= LANDING ================= -->
<section id="landing" class="text-center max-w-2xl">

  <h1 class="text-4xl md:text-5xl font-bold">
    Stock & Equity <span class="text-gray-400">Investment Platform</span>
  </h1>

  <p class="text-gray-400 mt-6">
    Structured investment system for portfolio growth and capital planning.
  </p>

  <button onclick="showTiers()"
    class="mt-10 px-8 py-3 bg-white text-black font-semibold rounded-xl">
    Start Investing
  </button>

</section>

<!-- ================= TIERS ================= -->
<section id="tiers" class="hidden w-full max-w-6xl mt-20">

<h2 class="text-3xl font-bold text-center mb-12">Investment Tiers</h2>

<div class="grid grid-cols-1 md:grid-cols-3 gap-8">

<!-- VIP -->
<div class="glass border border-white/10 p-6 rounded-2xl card smooth">
<h3 class="text-xl font-bold">VIP</h3>
<p class="text-gray-400">$1K - $10K</p>

<button onclick="openCalc('VIP',1000,10000)"
class="mt-6 w-full bg-white text-black py-2 rounded-xl">
Invest
</button>
</div>

<!-- EXPERT -->
<div class="glass border border-white/20 p-6 rounded-2xl card smooth scale-105">
<h3 class="text-xl font-bold">Expert</h3>
<p class="text-gray-400">$10K - $50K</p>

<button onclick="openCalc('Expert',10000,50000)"
class="mt-6 w-full bg-white text-black py-2 rounded-xl">
Invest
</button>
</div>

<!-- DIAMOND -->
<div class="glass border border-white/10 p-6 rounded-2xl card smooth">
<h3 class="text-xl font-bold">Diamond</h3>
<p class="text-gray-400">$50K+</p>

<button onclick="openCalc('Diamond',50000,9999999)"
class="mt-6 w-full bg-white text-black py-2 rounded-xl">
Invest
</button>
</div>

</div>
</section>

<!-- ================= CALCULATOR ================= -->
<div id="modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-6 z-50">

<div class="bg-black border border-white/20 p-6 rounded-2xl w-full max-w-md">

<h2 id="tierName" class="text-xl font-bold mb-2"></h2>

<input id="amount" type="number"
class="w-full p-3 bg-white/5 border border-white/10 rounded-xl"
placeholder="Enter amount" oninput="calc()">

<p id="error" class="text-red-400 text-xs mt-2 hidden">Invalid amount</p>

<div class="mt-5 text-center">
<p class="text-gray-400 text-xs">Projected Return</p>
<h2 id="result" class="text-2xl font-bold">$0</h2>
</div>

<button onclick="openPayment()"
class="mt-6 w-full bg-white text-black py-2 rounded-xl">
Proceed
</button>

<button onclick="closeModal()" class="mt-3 text-gray-400 w-full text-sm">
Close
</button>

</div>
</div>

<!-- ================= PAYMENT ================= -->
<div id="payModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-6 z-50">

<div class="bg-black border border-white/20 p-6 rounded-2xl w-full max-w-md">

<h2 class="text-xl font-bold mb-4">Payment</h2>

<input placeholder="Card Number" class="w-full p-3 mb-3 bg-white/5 border rounded-xl">
<input placeholder="Expiry" class="w-full p-3 mb-3 bg-white/5 border rounded-xl">
<input placeholder="CVV" class="w-full p-3 mb-3 bg-white/5 border rounded-xl">

<button onclick="confirmPayment()" class="w-full bg-white text-black py-2 rounded-xl">
Confirm
</button>

<button onclick="closePayment()" class="mt-3 text-gray-400 w-full text-sm">
Cancel
</button>

</div>
</div>

<script>

let min=0,max=0,user=null;

// AUTH
function openAuth(){document.getElementById("authModal").classList.remove("hidden")}
function closeAuth(){document.getElementById("authModal").classList.add("hidden")}

function register(){
user=document.getElementById("email").value;
localStorage.setItem("user",user);
updateAuth();
closeAuth();
}

function login(){
let e=document.getElementById("email").value;
if(localStorage.getItem("user")===e){
user=e;updateAuth();closeAuth();
}else alert("No account found");
}

function updateAuth(){
document.getElementById("authState").innerText =
user ? "Logged in: " + user : "Not logged in";
}

// NAV
function showTiers(){
document.getElementById("landing").classList.add("hidden");
document.getElementById("tiers").classList.remove("hidden");
}

// INVEST
function openCalc(t,mn,mx){
min=mn;max=mx;
document.getElementById("modal").classList.remove("hidden");
document.getElementById("tierName").innerText=t;
document.getElementById("amount").value=mn;
calc();
}

function closeModal(){
document.getElementById("modal").classList.add("hidden");
}

// CALC
function calc(){
let v=parseFloat(document.getElementById("amount").value);
if(isNaN(v)||v<min||v>max){
document.getElementById("error").classList.remove("hidden");
document.getElementById("result").innerText="$0";
return;
}
document.getElementById("error").classList.add("hidden");
document.getElementById("result").innerText="$"+(v*3).toLocaleString();
}

// PAYMENT
function openPayment(){
if(!user){alert("Login required");return;}
document.getElementById("payModal").classList.remove("hidden");
}

function closePayment(){
document.getElementById("payModal").classList.add("hidden");
}

function confirmPayment(){
alert("Success");
closePayment();
}

updateAuth();

</script>

</body>
</html>

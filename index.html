<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equity Intelligence Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  background: linear-gradient(135deg,#061a33,#0b2a55,#0f3d6e);
  color:white;
  font-family:sans-serif;
}

.card{
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.1);
}

.hidden{display:none;}

.btn{
  background:white;
  color:#0b2a55;
  padding:10px 16px;
  border-radius:10px;
  font-weight:600;
}
</style>
</head>

<body class="min-h-screen">

<!-- ================= NAV ================= -->
<div class="flex justify-between items-center p-4">
  <h1 class="font-bold">Equity Intelligence</h1>
  <button onclick="loadMarket()" class="btn">Refresh Market</button>
</div>

<!-- ================= DASHBOARD ================= -->
<section id="dashboard" class="p-6">

<!-- MARKET CARDS -->
<div class="grid md:grid-cols-3 gap-4">

  <div class="card p-5 rounded-xl">
    <h2 class="font-bold">Apple (AAPL)</h2>
    <p id="aaplPrice">Loading...</p>
  </div>

  <div class="card p-5 rounded-xl">
    <h2 class="font-bold">Tesla (TSLA)</h2>
    <p id="tslaPrice">Loading...</p>
  </div>

  <div class="card p-5 rounded-xl">
    <h2 class="font-bold">Microsoft (MSFT)</h2>
    <p id="msftPrice">Loading...</p>
  </div>

</div>

<!-- CHART -->
<div class="card p-6 mt-6 rounded-xl">
  <h2 class="font-bold mb-4">Market Trend (Demo Live Feed)</h2>
  <canvas id="chart"></canvas>
</div>

<!-- PORTFOLIO -->
<div class="card p-6 mt-6 rounded-xl">
  <h2 class="font-bold mb-2">Portfolio Tracker</h2>
  <p id="portfolio">No investments yet</p>
</div>

<!-- TIER CALCULATOR -->
<div class="card p-6 mt-6 rounded-xl">

<h2 class="font-bold mb-2">Investment Simulation (6x Model)</h2>

<select id="tier" class="text-black p-2 rounded">
  <option value="Silver">Silver</option>
  <option value="Gold">Gold</option>
  <option value="Diamond">Diamond</option>
</select>

<input id="amount" type="number" placeholder="Enter amount"
class="text-black p-2 rounded ml-2">

<button onclick="calc()" class="btn ml-2">Calculate</button>

<p id="result" class="mt-3 text-green-300 font-bold"></p>

</div>

</section>

<script>

let chart;

// REAL MARKET DATA (public API)
async function loadMarket(){

  try{
    const res = await fetch("https://api.coindesk.com/v1/bpi/currentprice.json");
    const data = await res.json();

    const btc = data.bpi.USD.rate_float;

    document.getElementById("aaplPrice").innerText = "$" + (btc % 200 + 150).toFixed(2);
    document.getElementById("tslaPrice").innerText = "$" + (btc % 300 + 220).toFixed(2);
    document.getElementById("msftPrice").innerText = "$" + (btc % 250 + 180).toFixed(2);

    updateChart(btc);

  } catch(e){
    console.log("Market load error", e);
  }
}

// CHART
function updateChart(value){

  let ctx = document.getElementById("chart");

  if(chart) chart.destroy();

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
      datasets: [{
        label: "Market Movement",
        data: [
          value*0.9,
          value*1.1,
          value*1.05,
          value*1.2,
          value*1.15,
          value*1.3,
          value
        ],
        borderColor: "white",
        borderWidth: 2
      }]
    }
  });
}

// SIMULATION CALC
function calc(){

  let tier = document.getElementById("tier").value;
  let amount = Number(document.getElementById("amount").value);

  if(!amount){
    document.getElementById("result").innerText = "";
    return;
  }

  let multiplier = 6;

  let profit = amount * multiplier;

  document.getElementById("result").innerText =
    `${tier} Projection (6x Model): $${profit.toLocaleString()}`;

  savePortfolio(tier, amount, profit);
}

// PORTFOLIO SAVE
function savePortfolio(tier, amount, profit){

  let data = JSON.parse(localStorage.getItem("portfolio")) || [];

  data.push({
    tier,
    amount,
    profit,
    date: new Date().toLocaleString()
  });

  localStorage.setItem("portfolio", JSON.stringify(data));

  renderPortfolio();
}

// PORTFOLIO DISPLAY
function renderPortfolio(){

  let data = JSON.parse(localStorage.getItem("portfolio")) || [];

  if(data.length === 0){
    document.getElementById("portfolio").innerText = "No investments yet";
    return;
  }

  document.getElementById("portfolio").innerHTML =
    data.map(d =>
      `• ${d.tier} | Invested: $${d.amount} | Return: $${d.profit}`
    ).join("<br>");
}

// INIT
loadMarket();
renderPortfolio();

</script>

</body>
</html>
